let farmSliderTimer;
function initFarmSlider(){clearInterval(farmSliderTimer);const root=document.querySelector('.native-farm-slider');if(!root)return;const slides=[...root.querySelectorAll('.farm-slide')],dots=[...root.querySelectorAll('.farm-dot')];let current=0;const show=i=>{current=(i+slides.length)%slides.length;slides.forEach((el,j)=>{el.classList.toggle('is-active',j===current);el.setAttribute('aria-hidden',String(j!==current))});dots.forEach((el,j)=>el.classList.toggle('is-active',j===current))};const restart=()=>{clearInterval(farmSliderTimer);if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)farmSliderTimer=setInterval(()=>{if(!document.hidden)show(current+1)},5500)};root.querySelector('.farm-prev').onclick=()=>{show(current-1);restart()};root.querySelector('.farm-next').onclick=()=>{show(current+1);restart()};dots.forEach((dot,i)=>dot.onclick=()=>{show(i);restart()});root.addEventListener('mouseenter',()=>clearInterval(farmSliderTimer));root.addEventListener('mouseleave',restart);restart()}
