{id:'energia-assinatura',name:'ENERGIA POR ASSINATURA',desc:'Energia solar para consumidores, sem instalar placas no imóvel.',image:'https://images.unsplash.com/photo-1497440001374-f26997328c1b?auto=format&fit=crop&w=900&q=85',intro:'A energia por assinatura utiliza o mecanismo de compensação da geração compartilhada. A elegibilidade, a disponibilidade e a economia dependem das condições da distribuidora e do contrato.',steps:['Análise da fatura','Simulação personalizada','Adesão e acompanhamento']},

function render(){const key=decodeURIComponent(location.hash.slice(1));const x=data.find(p=>p.id===key);document.getElementById('app').innerHTML=x?product(x):home();document.body.classList.toggle('approved-home',!x);document.title=(x?x.name+' | ':'')+'Energizar Livre';document.getElementById('navlinks').classList.remove('open');const form=document.getElementById('leadform');if(form)form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);const msg='Olá, Energizar Livre! Meu nome é '+d.get('nome')+'. E-mail: '+d.get('email')+'. WhatsApp: '+d.get('fone')+'. Tenho interesse em '+d.get('servico')+'.';const box=document.getElementById('message');box.textContent='Mensagem preparada. Configure o número oficial para habilitar o envio. ';const b=document.createElement('button');b.type='button';b.className='btn';b.textContent='COPIAR MENSAGEM';b.onclick=()=>navigator.clipboard.writeText(msg);box.appendChild(b)};if(x)window.scrollTo(0,0);else if(key){const targets={inicio:0,solucoes:.33,empresa:.54,fazendas:.83,contato:.9};const img=document.querySelector('#approved-home img');const scroll=()=>{if(img&&Object.prototype.hasOwnProperty.call(targets,key)){window.scrollTo({top:img.getBoundingClientRect().top+window.scrollY+img.offsetHeight*targets[key],behavior:'smooth'})}};if(img&&!img.complete)img.addEventListener('load',scroll,{once:true});else setTimeout(scroll,30)}}window.addEventListener('hashchange',render);document.getElementById('mobile').onclick=()=>document.getElementById('navlinks').classList.toggle('open');render();
